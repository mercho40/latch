name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  packages:
    name: Package tests
    runs-on: macos-26
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: [Packages/LatchACP, Packages/LatchServiceProtocol, Packages/LatchAgentCore]
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift test --package-path ${{ matrix.package }}

  app:
    name: App tests and bundle
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: xcodebuild -version
      # Window tests and the smoke test need a window server; hosted macOS runners have a logged-in GUI session.
      - run: swift test --package-path Apps/LatchMac
      - run: bash Scripts/test-mac-app.sh --release
      - run: bash Scripts/test-xpc-process.sh

  secrets:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Scan full history with gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.21.2 \
            git /repo --redact --no-banner --exit-code 1
